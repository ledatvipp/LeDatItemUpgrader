# Toàn bộ text command nằm ở đây. Placeholder {name} được chèn dạng text, không parse MiniMessage.
# Thiếu key dùng default sinh từ file bundled khi build; không dùng message hardcode viết tay trong Java.
# Giữ mỗi message trên một dòng và đặt trong dấu nháy đơn (để generator fallback đọc chính xác).
