# Boost chỉ xuất hiện khi enabled, đủ permission/condition và hợp profile.
# Có thể dùng Bỏ chọn tất cả để gỡ boost đã chọn nhưng hiện không còn đủ điều kiện.
# Chọn booster không tiêu item/tiền; quote sẽ kiểm tra tài nguyên thật.
config-version: 1
id: 'boosts'
title: '<dark_gray>Boosts · {page}</dark_gray>'
matrix:
  - '##D#I####'
  - '#EEEEEEE#'
  - '#EEEEEEE#'
  - '#EEEEEEE#'
  - '#EEEEEEE#'
  - '<##HR##>X'
symbols:
  '#':
    role: 'FILLER'
    material: 'BLACK_STAINED_GLASS_PANE'
    name: ' '
    lore: []
    item-model: ''
    glow: false
    action: 'NONE'
    argument: ''
    # custom-model-data: 10001  # Tùy chọn; ưu tiên item-model cho pack hiện đại.
  '<':
    role: 'BUTTON'
    material: 'ARROW'
    name: '<yellow>Trang trước</yellow>'
    lore:
      - '<gray>Trang {page}/{pages}</gray>'
    item-model: ''
    glow: false
    action: 'PREVIOUS_PAGE'
    argument: ''
    # custom-model-data: 10001  # Tùy chọn; ưu tiên item-model cho pack hiện đại.
  '>':
    role: 'BUTTON'
    material: 'ARROW'
    name: '<yellow>Trang sau</yellow>'
    lore:
      - '<gray>Trang {page}/{pages}</gray>'
    item-model: ''
    glow: false
    action: 'NEXT_PAGE'
    argument: ''
    # custom-model-data: 10001  # Tùy chọn; ưu tiên item-model cho pack hiện đại.
  'H':
    role: 'BUTTON'
    material: 'OAK_DOOR'
    name: '<aqua>Về menu chính</aqua>'
    lore: []
    item-model: ''
    glow: false
    action: 'BACK_MAIN'
    argument: ''
    # custom-model-data: 10001  # Tùy chọn; ưu tiên item-model cho pack hiện đại.
  'R':
    role: 'BUTTON'
    material: 'SUNFLOWER'
    name: '<yellow>Làm mới</yellow>'
    lore: []
    item-model: ''
    glow: false
    action: 'REFRESH'
    argument: ''
    # custom-model-data: 10001  # Tùy chọn; ưu tiên item-model cho pack hiện đại.
  'X':
    role: 'BUTTON'
    material: 'BARRIER'
    name: '<red>Đóng</red>'
    lore: []
    item-model: ''
    glow: false
    action: 'CLOSE'
    argument: ''
    # custom-model-data: 10001  # Tùy chọn; ưu tiên item-model cho pack hiện đại.
  'I':
    role: 'INFO'
    material: 'BOOK'
    name: '<white>Chi tiết quote</white>'
    lore:
      - '<gray>Profile: {profile}</gray>'
      - '<gray>Boosts: {boosts}</gray>'
      - '<gray>Failure: {failure}</gray>'
      - '<yellow>{status}</yellow>'
      - '<gray>Cần có trước: {fee}</gray>'
    item-model: ''
    glow: false
    action: 'NONE'
    argument: ''
    # custom-model-data: 10001  # Tùy chọn; ưu tiên item-model cho pack hiện đại.
  'D':
    role: 'BUTTON'
    material: 'MILK_BUCKET'
    name: '<yellow>Bỏ chọn tất cả boosts</yellow>'
    lore: []
    item-model: ''
    glow: false
    action: 'CLEAR_BOOSTS'
    argument: ''
    # custom-model-data: 10001  # Tùy chọn; ưu tiên item-model cho pack hiện đại.
  'E':
    role: 'BOOST_ENTRY'
    material: 'BLAZE_POWDER'
    name: '<gold>Boost: {id}</gold>'
    lore:
      - '<gray>Chance: ×{multiplier}, +{points} điểm phần trăm</gray>'
      - '<yellow>{selected}</yellow>'
      - '<gray>Click để chọn hoặc bỏ chọn.</gray>'
    item-model: ''
    glow: false
    action: 'TOGGLE_BOOST'
    argument: ''
    # custom-model-data: 10001  # Tùy chọn; ưu tiên item-model cho pack hiện đại.
