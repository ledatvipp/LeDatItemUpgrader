# Filter quyền/path/condition trước phân trang. Chọn profile KHÔNG âm thầm bỏ boosts đã chọn.
# Boost không phù hợp làm quote bị từ chối; quay sang menu Boosts để bỏ chọn.
config-version: 1
id: 'profiles'
title: '<dark_gray>Profiles · {page}</dark_gray>'
matrix:
  - '....I....'
  - '.EEEEEEE.'
  - '.EEEEEEE.'
  - '.EEEEEEE.'
  - '.EEEEEEE.'
  - '<..HR..>X'
symbols:
  '<':
    role: 'BUTTON'
    material: 'PAPER'
    name: '<yellow>Trang trước</yellow>'
    lore:
      - '<gray>Trang {page}/{pages}</gray>'
    item-model: 'thanhviet:empty'
    glow: false
    action: 'PREVIOUS_PAGE'
    argument: ''
    # custom-model-data: 10001  # Tùy chọn; ưu tiên item-model cho pack hiện đại.
  '>':
    role: 'BUTTON'
    material: 'PAPER'
    name: '<yellow>Trang sau</yellow>'
    lore:
      - '<gray>Trang {page}/{pages}</gray>'
    item-model: 'thanhviet:empty'
    glow: false
    action: 'NEXT_PAGE'
    argument: ''
    # custom-model-data: 10001  # Tùy chọn; ưu tiên item-model cho pack hiện đại.
  'H':
    role: 'BUTTON'
    material: 'PAPER'
    name: '<aqua>Về menu chính</aqua>'
    lore: []
    item-model: 'thanhviet:empty'
    glow: false
    action: 'BACK_MAIN'
    argument: ''
    # custom-model-data: 10001  # Tùy chọn; ưu tiên item-model cho pack hiện đại.
  'R':
    role: 'BUTTON'
    material: 'PAPER'
    name: '<yellow>Làm mới</yellow>'
    lore: []
    item-model: 'thanhviet:empty'
    glow: false
    action: 'REFRESH'
    argument: ''
    # custom-model-data: 10001  # Tùy chọn; ưu tiên item-model cho pack hiện đại.
  'X':
    role: 'BUTTON'
    material: 'PAPER'
    name: '<red>Đóng</red>'
    lore: []
    item-model: 'thanhviet:empty'
    glow: false
    action: 'CLOSE'
    argument: ''
    # custom-model-data: 10001  # Tùy chọn; ưu tiên item-model cho pack hiện đại.
  'I':
    role: 'INFO'
    material: 'PAPER'
    name: '<white>Chi tiết quote</white>'
    lore:
      - '<gray>Profile: {profile}</gray>'
      - '<gray>Boosts: {boosts}</gray>'
      - '<gray>Failure: {failure}</gray>'
      - '<yellow>{status}</yellow>'
      - '<gray>Cần có trước: {fee}</gray>'
    item-model: 'thanhviet:empty'
    glow: false
    action: 'NONE'
    argument: ''
    # custom-model-data: 10001  # Tùy chọn; ưu tiên item-model cho pack hiện đại.
  'E':
    role: 'PROFILE_ENTRY'
    material: 'PAPER'
    name: '<green>Profile: {id}</green>'
    lore:
      - '<gray>Chance multiplier: ×{multiplier}</gray>'
      - '<gray>Fee multiplier: ×{fee_multiplier}</gray>'
      - '<gray>{failure}</gray>'
      - '<yellow>{selected}</yellow>'
    item-model: 'thanhviet:empty'
    glow: false
    action: 'SELECT_PROFILE'
    argument: ''
    # custom-model-data: 10001  # Tùy chọn; ưu tiên item-model cho pack hiện đại.
