# Mỗi CATALOG_ENTRY được bind theo target ID đã qua điều kiện. Không đặt argument tĩnh.
# Số slot E quyết định page-size của GUI; command catalog vẫn có page-size riêng.
config-version: 1
id: 'catalog'
title: '<dark_gray>Target Catalog · {page}</dark_gray>'
matrix:
  - '..O.I.F..'
  - '.EEEEEEE.'
  - '.EEEEEEE.'
  - '.EEEEEEE.'
  - '.EEEEEEE.'
  - '<..HR..>X'
symbols:
  '<':
    role: 'BUTTON'
    material: 'PAPER'
    name: '<yellow>Trang trước</yellow>'
    lore:
      - '<gray>Trang {page}/{pages}</gray>'
    item-model: 'thanhviet:empty'
    glow: false
    action: 'PREVIOUS_PAGE'
    argument: ''
    # custom-model-data: 10001  # Tùy chọn; ưu tiên item-model cho pack hiện đại.
  '>':
    role: 'BUTTON'
    material: 'PAPER'
    name: '<yellow>Trang sau</yellow>'
    lore:
      - '<gray>Trang {page}/{pages}</gray>'
    item-model: 'thanhviet:empty'
    glow: false
    action: 'NEXT_PAGE'
    argument: ''
    # custom-model-data: 10001  # Tùy chọn; ưu tiên item-model cho pack hiện đại.
  'H':
    role: 'BUTTON'
    material: 'PAPER'
    name: '<aqua>Về menu chính</aqua>'
    lore: []
    item-model: 'thanhviet:empty'
    glow: false
    action: 'BACK_MAIN'
    argument: ''
    # custom-model-data: 10001  # Tùy chọn; ưu tiên item-model cho pack hiện đại.
  'R':
    role: 'BUTTON'
    material: 'PAPER'
    name: '<yellow>Làm mới</yellow>'
    lore: []
    item-model: 'thanhviet:empty'
    glow: false
    action: 'REFRESH'
    argument: ''
    # custom-model-data: 10001  # Tùy chọn; ưu tiên item-model cho pack hiện đại.
  'X':
    role: 'BUTTON'
    material: 'PAPER'
    name: '<red>Đóng</red>'
    lore: []
    item-model: 'thanhviet:empty'
    glow: false
    action: 'CLOSE'
    argument: ''
    # custom-model-data: 10001  # Tùy chọn; ưu tiên item-model cho pack hiện đại.
  'I':
    role: 'INFO'
    material: 'PAPER'
    name: '<white>Chi tiết quote</white>'
    lore:
      - '<gray>Profile: {profile}</gray>'
      - '<gray>Boosts: {boosts}</gray>'
      - '<gray>Failure: {failure}</gray>'
      - '<yellow>{status}</yellow>'
      - '<gray>Cần có trước: {fee}</gray>'
    item-model: 'thanhviet:empty'
    glow: false
    action: 'NONE'
    argument: ''
    # custom-model-data: 10001  # Tùy chọn; ưu tiên item-model cho pack hiện đại.
  'O':
    role: 'BUTTON'
    material: 'PAPER'
    name: '<white>Sắp xếp: {sort}</white>'
    lore:
      - '<gray>Click để đổi; trở về trang 1.</gray>'
    item-model: 'thanhviet:empty'
    glow: false
    action: 'CYCLE_SORT'
    argument: ''
    # custom-model-data: 10001  # Tùy chọn; ưu tiên item-model cho pack hiện đại.
  'F':
    role: 'BUTTON'
    material: 'PAPER'
    name: '<white>Nhóm: {category}</white>'
    lore:
      - '<gray>Click để đổi; trở về trang 1.</gray>'
    item-model: 'thanhviet:empty'
    glow: false
    action: 'CYCLE_CATEGORY'
    argument: ''
    # custom-model-data: 10001  # Tùy chọn; ưu tiên item-model cho pack hiện đại.
  'E':
    role: 'CATALOG_ENTRY'
    material: 'PAPER'
    name: '<aqua>{id}</aqua>'
    lore:
      - '<gray>{item} ×{amount}</gray>'
      - '<gray>Tổng value: {value}</gray>'
      - '<gray>{selected}</gray>'
      - '<yellow>Chọn target, không nhận item.</yellow>'
    item-model: 'thanhviet:empty'
    glow: false
    action: 'SELECT_TARGET'
    argument: ''
    # custom-model-data: 10001  # Tùy chọn; ưu tiên item-model cho pack hiện đại.
