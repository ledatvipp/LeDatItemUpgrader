tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Werror'] }
tasks.register('selfTest', JavaExec) {
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'vn.ledat.itemupgrader.test.CoreSelfTest'
    args layout.buildDirectory.file('reports/self-test.xml').get().asFile.absolutePath
}
tasks.named('test') { enabled = false } // Self-contained Java assertion suite; no JUnit dependency.
tasks.named('check') { dependsOn selfTest }
